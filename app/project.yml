name: Squint
options:
  bundleIdPrefix: net.mdws
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # Pinned to one exact version, because the project file is generated and so
  # Package.resolved is not committed with it: this line is the only thing
  # standing between a release build and a version nobody reviewed. The
  # revision the pin resolves to is recorded in docs/RELEASING.md, which is
  # what a build can be checked against. Sparkle ships the tools that sign and
  # list updates in the same distribution.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  Squint:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
      - path: ../design/squint.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Squint
        PRODUCT_BUNDLE_IDENTIFIER: net.mdws.squint
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Squint-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/target/release
        OTHER_LDFLAGS: -lsquint_core
        # Deliberately unsandboxed. Overwriting arbitrary files in place, which is
        # the whole point of the app, is not possible under the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        # Hardened runtime is a property of a signature, so this does nothing
        # while signing is off, and signing is off in the build on purpose: the
        # release is signed afterwards by tools/sign-release.sh, which applies
        # the runtime itself with `--options runtime`. It is left here, and
        # named as inert, so that
        # setting up notarization does not mistake it for work already done.
        ENABLE_HARDENED_RUNTIME: YES  # inert until CODE_SIGNING_ALLOWED is YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Info.plist
      properties:
        CFBundleName: Squint
        CFBundleIconFile: squint
        # XcodeGen writes a fixed 1.0 and 1 into the generated plist unless told
        # to take them from the build settings. Every build through v0.1.1
        # reported itself as 1.0 for that reason; the release tag and the app
        # never agreed.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        # Where Sparkle looks for the list of released versions, and the public
        # half of the key every update archive is signed with. The private half
        # is not on any build machine: it lives in 1Password and is fetched for
        # the one command that signs a release.
        #
        # SUEnableAutomaticChecks is deliberately unset. Sparkle then asks once,
        # on the first launch that would have checked, whether to check
        # automatically. An application whose purpose is removing what a
        # photograph discloses should ask before it starts talking to a server
        # on a schedule.
        SUFeedURL: https://raw.githubusercontent.com/mdws-org/squint/main/appcast.xml
        SUPublicEDKey: 6FzlDrtCklzeHwPAZ097Oxu3WKoRrHk0VO3glbJptU0=
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHighResolutionCapable: true
        # The Finder right-click entries, one per mode. Services are listed
        # alphabetically by title; there is no ordering key, so placement in the
        # menu cannot be controlled beyond the name itself.
        #
        # Each is named for what it does rather than for how hard it works.
        # NSServiceDescription is written below but macOS never renders it, so
        # the title is the only thing anyone reads, and "Fast" against "Quality"
        # asks for a decision at the moment of use that the preset should be
        # making instead.
        #
        # NSMessage must match the @objc method name on ServiceProvider. A
        # mismatch fails silently: the item appears and does nothing.
        NSServices:
          - NSMenuItem:
              default: "Squint: Shrink"
            NSMessage: optimizeFast
            NSPortName: Squint
            # A PDF is offered to the two in-place entries and to nothing
            # else: it is rewritten as a PDF with the pictures inside it
            # re-encoded, which is in-place work, and it never becomes a
            # picture, so the entries that write a JPEG or an AVIF beside
            # the original have nothing to write.
            NSSendFileTypes:
              - public.jpeg
              - public.png
              - com.adobe.pdf
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: Shrink images in place, keeping the colour profile; a PDF has its pictures re-encoded
          - NSMenuItem:
              default: "Squint: Shrink for Email"
            NSMessage: shrinkForEmail
            NSPortName: Squint
            # AVIF needs naming in its own right: it does NOT conform to
            # public.heif, and neither does public.heic — both conform to
            # public.heif-standard instead, so the two entries above cover
            # nothing else. Measured with UTTypeConformsTo, not assumed.
            NSSendFileTypes:
              - public.jpeg
              - public.png
              - public.heic
              - public.heif
              - public.avif
              - org.webmproject.webp
              - public.svg-image
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: "Shrink to 2048 pixels beside the original, sized for sending; a HEIC becomes a JPEG"
          - NSMenuItem:
              default: "Squint: Shrink for Social"
            NSMessage: shrinkForSocial
            NSPortName: Squint
            NSSendFileTypes:
              - public.jpeg
              - public.png
              - public.heic
              - public.heif
              - public.avif
              - org.webmproject.webp
              - public.svg-image
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: "Shrink to 1440 pixels beside the original, sized for posting; a HEIC becomes a JPEG"
          - NSMenuItem:
              default: "Squint: Shrink to a Quality Target"
            NSMessage: optimizeQuality
            NSPortName: Squint
            NSSendFileTypes:
              - public.jpeg
              - public.png
              - com.adobe.pdf
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: Shrink images to a perceptual quality target; a PDF has its pictures re-encoded
          - NSMenuItem:
              default: "Squint: Convert to AVIF"
            NSMessage: convertToAvif
            NSPortName: Squint
            # Every raster the engine can decode, and no AVIF: converting one
            # to itself would only write over it. TIFF and GIF are absent
            # because the engine cannot decode them for a re-encode, a PDF
            # because it never becomes a picture, and SVG because a raster of
            # a drawing is larger than the drawing and the engine refuses a
            # conversion that grows the file, so the entry would always
            # refuse.
            NSSendFileTypes:
              - public.jpeg
              - public.png
              - public.heic
              - public.heif
              - org.webmproject.webp
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: "Write an AVIF beside the original at the picture's own size, searched to the quality target"
          - NSMenuItem:
              default: "Squint: Remove Location Data"
            NSMessage: stripMetadata
            NSPortName: Squint
            NSSendFileTypes:
              - public.jpeg
              - public.png
              # HEIC is what an iPhone camera writes, AVIF and WebP are what a
              # browser hands you, TIFF is what a scanner does, and a GIF
              # carries whatever comment or application block its encoder
              # wrote. Removing what they disclose is the one thing squint can
              # do to any of them, since it re-encodes none of them as itself.
              #
              # SVG is deliberately absent: a drawing has no metadata block
              # this strips, and the engine has no strip path for one, so
              # offering it would put an entry in the menu that always fails.
              #
              # A PDF says who wrote it, with what, and when, in its info
              # dictionary and again in an XMP packet; both go and the pages
              # are untouched.
              - public.heic
              - public.heif
              - public.avif
              - org.webmproject.webp
              - public.tiff
              - com.compuserve.gif
              - com.adobe.pdf
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
              NSTextContent: FilePath
            NSServiceDescription: Remove location and camera data without re-encoding
    preBuildScripts:
      - name: Build the engine
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd "$SRCROOT/../core"
          cargo build --release --locked
