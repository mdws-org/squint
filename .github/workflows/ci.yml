name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    name: cargo check + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: tools compile
        run: python3 -m py_compile tools/corpus-seeds.py tools/corpus-gen.py tools/corpus-run.py tools/jpeg-segments.py
      - name: check
        run: cargo check --locked --all-targets
        working-directory: core
      - name: test
        run: cargo test --locked
        working-directory: core

  macos:
    name: build, test, corpus (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --locked
        working-directory: core
      - name: build release
        run: cargo build --release --locked
        working-directory: core
      - name: generate seeds
        run: python3 tools/corpus-seeds.py seeds
      - name: generate corpus
        run: python3 tools/corpus-gen.py seeds/seed.png seeds/seed.jpg seeds/seed.heic -o corpus
      - name: run corpus
        run: python3 tools/corpus-run.py core/target/release/squint corpus -o corpus-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-report
          path: corpus-report.json
