name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    name: cargo check + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      # Caches compiled dependencies; squint-core is rebuilt every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
      - name: tools compile
        run: python3 -m py_compile tools/corpus-seeds.py tools/corpus-gen.py tools/corpus-run.py tools/jpeg-segments.py
      - name: check
        run: cargo check --locked --all-targets
        working-directory: core
      # The lints are the [lints] table in core/Cargo.toml; any warning fails the job.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: core
      - name: test
        run: cargo test --locked
        working-directory: core
      # The Mac App Store build leaves libimagequant out; it must still build
      # and pass, and must not link the library at all.
      - name: test without lossy PNG
        run: |
          cargo test --locked --no-default-features
          if cargo tree --locked --no-default-features -e normal | grep -q imagequant; then
            echo "imagequant is still a dependency without the lossy-png feature" >&2
            exit 1
          fi
        working-directory: core

  macos:
    name: build, test, corpus (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
      - name: test
        run: cargo test --locked
        working-directory: core
      - name: build release
        run: cargo build --release --locked
        working-directory: core
      - name: generate seeds
        run: python3 tools/corpus-seeds.py seeds
      - name: generate corpus
        run: python3 tools/corpus-gen.py seeds/seed.png seeds/seed.jpg seeds/seed.heic -o corpus
      - name: run corpus
        run: python3 tools/corpus-run.py core/target/release/squint corpus -o corpus-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-report
          path: corpus-report.json
