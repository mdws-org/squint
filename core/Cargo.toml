[package]
name = "squint-core"
version = "0.9.4"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Perceptual image compression engine for squint"

[dependencies]
fast-ssim2 = { version = "0.8", features = ["imgref"] }
imgref = "1.12"
mozjpeg = "0.10"
imagequant = { version = "4.4", optional = true }
oxipng = { version = "10", default-features = false, features = ["parallel", "zopfli"] }
rgb = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.48"
lopdf = { version = "0.45", default-features = false }

[features]
default = ["lossy-png"]
# Colour reduction for PNG, through libimagequant. Its licence does not cover
# App Store distribution, so the Mac App Store build turns this off and every
# PNG is then optimized losslessly.
lossy-png = ["dep:imagequant"]

[lib]
name = "squint_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "squint"
path = "src/main.rs"

[profile.release]
opt-level = 3
