# cargo-deny configuration. Run in CI by .github/workflows/supply-chain.yml.
#
# Only the advisories, bans, and sources checks run. The licenses check is
# deliberately excluded: squint is GPL-3 and links libimagequant, so the
# allow-list needs a deliberate pass rather than a guess.

[advisories]
# RustSec advisory database. Anything it reports fails the build.
# Add entries here only with a comment explaining why the risk is accepted.
ignore = []

[bans]
# Duplicate versions of a crate are noisy in this tree and are not a
# supply-chain signal on their own.
multiple-versions = "allow"

# Crates deleted from crates.io in the 2026-08-20 arrayref compromise.
# https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/
# They can no longer be served, so this is a tripwire: if one reappears in the
# tree under any version, the build stops.
deny = [
    { name = "proc-macro1" },
    { name = "proc-macro-en" },
    { name = "aovine" },
    { name = "arone" },
    { name = "aronenao" },
    { name = "tinymember" },
]

[sources]
# Every dependency must come from crates.io. A git or alternate-registry
# dependency appearing in the tree fails the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
